# Generated by the SDKWork web server standard (SDKWORK_WEBSERVER_SPEC.md)
# from server.common.toml + server.standalone.toml; do not edit by hand.
user sdkwork;
worker_processes auto;
pid /run/sdkwork/prompts/webserver.pid;
error_log /var/log/sdkwork/prompts/webserver/error.log warn;
events {
    worker_connections 1024;
}
http {
    sendfile on;
    keepalive_timeout 75;
    client_max_body_size 1100m;
    server_tokens off;
    gzip on;
    include snippets/adaptive-web.maps.conf;
    upstream gateway {
        least_conn;
        keepalive 32;
        server 127.0.0.1:8080;
    }
    server {
        listen 80;
        server_name prompts-staging.sdkwork.com prompts-staging.birdcoder.com prompts-staging.dtupay.com prompts-staging.sdkwork.cn prompts-staging.birdcoder.cn prompts-staging.dtupay.cn prompts-staging.skubc.com prompts-staging.skubc.cn prompts-staging.zowalk.com prompts-staging.zowalk.cn prompts-staging.offer86.com prompts-staging.offer86.cn prompts-staging.86offer.com prompts-staging.86offer.cn;
        include snippets/gateway-locations.nonproduction.conf;
    }
}
