# Generated by the SDKWork web server standard (SDKWORK_WEBSERVER_SPEC.md)
# from server.common.toml + server.cloud.toml; do not edit by hand.
user sdkwork;
worker_processes auto;
pid /run/sdkwork/prompts/webserver.pid;
error_log /var/log/sdkwork/prompts/webserver/error.log warn;
events {
    worker_connections 1024;
}
http {
    sendfile on;
    keepalive_timeout 75;
    client_max_body_size 1100m;
    server_tokens off;
    gzip on;
    include snippets/adaptive-web.maps.conf;
    upstream gateway {
        least_conn;
        keepalive 32;
        server sdkwork-api-cloud-gateway:8080;
    }
    server {
        listen 80;
        server_name prompts-dev.sdkwork.com prompts-dev.birdcoder.com prompts-dev.dtupay.com prompts-dev.sdkwork.cn prompts-dev.birdcoder.cn prompts-dev.dtupay.cn prompts-dev.skubc.com prompts-dev.skubc.cn prompts-dev.zowalk.com prompts-dev.zowalk.cn prompts-dev.offer86.com prompts-dev.offer86.cn prompts-dev.86offer.com prompts-dev.86offer.cn;
        include snippets/gateway-locations.nonproduction.conf;
    }
}
