# Generated by the SDKWork web server standard (SDKWORK_WEBSERVER_SPEC.md)
# from server.common.toml + server.cloud.toml; do not edit by hand.
user sdkwork;
worker_processes auto;
pid /run/sdkwork/prompts/webserver.pid;
error_log /var/log/sdkwork/prompts/webserver/error.log warn;
events {
    worker_connections 1024;
}
http {
    sendfile on;
    keepalive_timeout 75;
    client_max_body_size 1100m;
    server_tokens off;
    gzip on;
    upstream gateway {
        least_conn;
        keepalive 32;
        server sdkwork-api-cloud-gateway:8080;
    }
    server {
        listen 80;
        server_name prompts-demo.sdkwork.com prompts-demo.birdcoder.com prompts-demo.dtupay.com prompts-demo.noaper.com prompts-demo.sdkwork.cn prompts-demo.birdcoder.cn prompts-demo.dtupay.cn prompts-demo.noaper.cn prompts-demo.skubc.com prompts-demo.skubc.cn prompts-demo.zowalk.com prompts-demo.zowalk.cn prompts-demo.offer86.com prompts-demo.offer86.cn prompts-demo.86offer.com prompts-demo.86offer.cn;
        include snippets/gateway-api-locations.nonproduction.conf;
        location / {
            root /usr/share/sdkwork/prompts/web/pc;
            index index.html;
            try_files $uri $uri/ /index.html;
        }
    }
}
